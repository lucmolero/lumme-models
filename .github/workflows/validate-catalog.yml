name: validate-catalog

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and immutable download metadata
        run: |
          python - <<'PY'
          import json, re, urllib.parse
          from pathlib import Path
          data = json.loads(Path('catalog.json').read_text())
          assert isinstance(data, list) and data
          ids = set()
          for item in data:
              assert re.fullmatch(r'[a-z0-9][a-z0-9._-]{1,63}', item['id'])
              assert item['id'] not in ids
              ids.add(item['id'])
              assert item['sourceUrl'].startswith('https://')
              assert item.get('runtime', 'SHERPA_ONNX') in {'ANDROID_TTS', 'SHERPA_KOKORO', 'SHERPA_SUPERTONIC', 'SHERPA_ONNX'}
              for path in item.get('requiredFiles', []):
                  assert path and not path.startswith('/') and '..' not in path and '\\' not in path
              if 'downloadUrl' in item:
                  assert item['downloadUrl'].startswith('https://')
                  assert re.fullmatch(r'[a-fA-F0-9]{64}', item['sha256'])
                  assert item['sizeBytes'] > 0
          books = json.loads(Path('free-books.json').read_text())
          assert isinstance(books, list) and books
          book_ids = set()
          for book in books:
              assert re.fullmatch(r'[a-z0-9][a-z0-9._-]{1,63}', book['id'])
              assert book['id'] not in book_ids
              book_ids.add(book['id'])
              assert book['source'].startswith('https://') and book['license']
              if book.get('downloadUrl'):
                  assert book['downloadUrl'].startswith('https://')
                  assert 0 < book['sizeBytes'] <= 200 * 1024 * 1024
                  assert re.fullmatch(r'[a-fA-F0-9]{64}', book['sha256'])
          PY
